[package]
name = "win-pingpang-tab"
version = "0.1.0"
edition = "2021"
description = "Alt+右键穿透激活鼠标下方被盖窗口的 Windows 切换工具"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
]

[dependencies]
png = "0.17"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "time"] }
windows-registry = "0.100.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
opt-level = "s"
